<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-File Answer Lookup</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d47a1; /* Deep Blue background */
            color: white;
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 450px;
            margin: 20px;
            background-color: #1565c0;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        input[type="text"] {
            width: 60%;
            padding: 10px;
            margin-right: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        button {
            background-color: #4caf50; /* Green Button */
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #388e3c;
        }
        #answer-display {
            margin-top: 30px;
            padding: 15px;
            background-color: white;
            color: #333;
            text-align: left;
            border-radius: 5px;
            min-height: 100px;
            line-height: 1.5;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
        }
        #answer-display p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter Your Exam Code</h2>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <input type="text" id="codeInput" placeholder="e.g., 577" maxlength="5">
        <button onclick="getAnswer()">VIEW ANSWER</button>
    </div>

    <div id="answer-display">
        Your answers will appear here after entering a valid code.
    </div>
</div>

<script>
    // 1. SIMULATED DATABASE (A JavaScript Object)
    const answerDatabase = {
        // Key: The code the user types
        // Value: The answer content to display (HTML formatted)
        "577": `
            <p style="color: red; font-weight: bold;">WAEC GCE 2025 ECONOMICS ANSWERS</p>
            <p>============================</p>
            <p style="margin-top: 15px;">**NOTE:** Answers are traced from the system. Use the letter options (A, B, C, D) carefully.</p>
            <br>
            <p>1: (D) reduction in agriculture contribution to the national income.</p>
            <p>2: (C) buying in bulk from the producers.</p>
            <p>3: (D) subtracting depreciation allowance from Gross National Income (GNI).</p>
            <p>4: (C) is parallel to the x-axis.</p>
            <p>5: (B) everyone in the society cannot have all the quantities they want.</p>
        `,
        "404": `
            <p style="color: red; font-weight: bold;">WAEC GCE 2025 LITERATURE ANSWERS</p>
            <p>===============================</p>
            <p>1: (A) The setting is in a tropical, coastal town.</p>
            <p>2: (B) Symbolism of the broken drum.</p>
        `,
        "admin123": `
            <p style="color: orange; font-weight: bold;">ADMIN PANEL ACCESS GRANTED</p>
            <p>Welcome, Administrator. Database status: OK.</p>
        `
    };

    /**
     * Function to retrieve and display the answer based on the entered code.
     */
    function getAnswer() {
        const codeInput = document.getElementById('codeInput');
        // Convert to uppercase and trim spaces for consistent lookup
        const enteredCode = codeInput.value.trim();

        const displayArea = document.getElementById('answer-display');

        // Check if the entered code exists in the database
        if (answerDatabase.hasOwnProperty(enteredCode)) {
            const answerContent = answerDatabase[enteredCode];
            
            // Display the content
            displayArea.innerHTML = answerContent;
            
            // Optional: clear the input field
            codeInput.value = ''; 
        } else {
            // Display an error message
            displayArea.innerHTML = `
                <p style="color: red; font-weight: bold;">❌ ERROR: INVALID CODE</p>
                <p>The code "${enteredCode}" was not found. Please check your PIN and try again.</p>
            `;
        }
    }
</script>
</body>
</html>
